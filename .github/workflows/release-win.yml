name: Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-win
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install NSIS
        shell: bash
        run: choco install nsis -y
      - name: Seed Google for the installer
        shell: bash
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node electron/seed-google.mjs
          if [ ! -f desktop/google-oauth.seed.json ]; then
            echo "Missing desktop/google-oauth.seed.json — set GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET repository secrets."
            exit 1
          fi
      - name: Build Windows installer
        shell: bash
        env:
          PATH: /c/Program Files (x86)/NSIS:${{ env.PATH }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run dist:win
      - name: Read version
        id: meta
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          BYTES=$(wc -c < release/Dynamic-Island-Setup.exe | tr -d ' ')
          echo "bytes=$BYTES" >> "$GITHUB_OUTPUT"
      - name: Upload installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          name: Dynamic Island ${{ steps.meta.outputs.version }}
          body: Google login is baked into the installer. After install, use Google로 로그인 — no Settings Client ID/Secret step.
          files: release/Dynamic-Island-Setup.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
