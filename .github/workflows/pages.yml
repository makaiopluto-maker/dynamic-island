name: Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip pages]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          PAGES_BASE: ./
      - name: Copy the built site to the repository root
        run: |
          rm -rf assets
          cp -a dist/assets assets
          cp dist/index.html index.html
          cp dist/favicon.svg favicon.svg
          cp dist/index.html 404.html
          touch .nojekyll
      - name: Commit the pages site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html 404.html favicon.svg assets .nojekyll
          git diff --staged --quiet && exit 0
          git commit -m "Publish the website [skip pages]"
          git push
